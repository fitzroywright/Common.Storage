name: Common.Storage CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Common.Diagnostics
        uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common.Diagnostics

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Common.Storage.slnx
        env:
          CommonRoot: ${{ github.workspace }}

      - name: Build Debug
        run: dotnet build Common.Storage.slnx --configuration Debug --no-restore
        env:
          CommonRoot: ${{ github.workspace }}
      - name: Build Release
        run: dotnet build Common.Storage.slnx --configuration Release --no-restore
        env:
          CommonRoot: ${{ github.workspace }}

      - name: Test
        run: dotnet test Common.Storage.slnx --configuration Release --no-build
        env:
          CommonRoot: ${{ github.workspace }}
